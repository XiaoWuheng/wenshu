name: Feature request
description: Suggest a workflow improvement for creators.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请从真实工作场景出发。请勿附上未公开稿件或个人信息。
  - type: textarea
    id: context
    attributes:
      label: 你的创作场景是什么？
      description: 说明你从事的创作类型，以及当下如何处理这项工作。
    validations:
      required: true
  - type: textarea
    id: pain
    attributes:
      label: 目前的困难是什么？
      description: 哪些步骤费时、容易出错或难以回查？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 你希望文枢怎样帮助你？
      description: 描述希望完成的事情或可观察到的结果。
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: 产品原则
      options:
        - label: 我理解建议会公开发布，且不会包含私人稿件或未授权素材。
          required: true
